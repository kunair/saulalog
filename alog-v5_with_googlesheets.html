<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-bg: #fdfdfd;
  --color-surface: #ffffff;
  --color-bg-sub: #f1f3f5;
  --color-border: #dee2e6;
  --color-text: #212529;
  --color-text-dim: #495057;
  --color-text-light: #adb5bd;
  
  --color-all: #7b1fa2;    
  --color-skill: #2e7d32;  
  --color-combat: #d32f2f; 
  --color-quest: #1565c0;  
  --color-clue: #ef6c00;   
  --color-misc: #455a64;   
}

body.dark-mode {
  --color-bg: #121212;
  --color-surface: #1e1e1e;
  --color-bg-sub: #2d2d2d;
  --color-border: #404040;
  --color-text: #f8f9fa;
  --color-text-dim: #ced4da;
  --color-text-light: #6c757d;

  --color-all: #ba68c8;    
  --color-skill: #81c784;  
  --color-combat: #e57373; 
  --color-quest: #64b5f6;  
  --color-clue: #ffd54f;   
  --color-misc: #90a4ae;   
}

body { background: var(--color-bg); color: var(--color-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; }
.wrap { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 1100px; margin: 0 auto; }

.header-row { width: 100%; max-width: 500px; display: flex; align-items: center; gap: 10px; }
.search-wrap { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
input[type=text], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-size: 14px; outline: none; transition: 0.1s; }
input[type=text]:focus { border-color: var(--color-all); box-shadow: 0 0 0 2px rgba(123, 31, 162, 0.1); }

.theme-toggle { cursor: pointer; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; transition: 0.1s; font-size: 18px; user-select: none; }
.theme-toggle:hover { border-color: var(--color-all); background: var(--color-bg-sub); }
.theme-toggle:active { transform: scale(0.92); }

.upload-area { border: 2px dashed var(--color-border); padding: 20px; width: 100%; text-align: center; border-radius: 10px; background: var(--color-surface); cursor: pointer; color: var(--color-text-dim); transition: 0.1s; font-size: 14px; font-weight: 500; user-select: none; }
.upload-area:hover { border-color: var(--color-all); background: var(--color-bg-sub); }
.upload-area:active { transform: scale(0.98); }
#csv-file { display: none; }

.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
.pill { 
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 20px; 
    border: 1px solid var(--color-border); font-size: 13px; cursor: pointer; background: var(--color-surface); 
    transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; user-select: none;
}
.pill:hover { background: var(--color-bg-sub); border-color: currentColor; }
.pill:active { transform: scale(0.95); }
.pill.active { border-color: currentColor; background: var(--color-bg-sub); box-shadow: 0 2px 8px rgba(0,0,0,0.1), inset 0 0 0 1px currentColor; }
.dot { width: 8px; height: 8px; border-radius: 50%; }

.sub-controls { background: var(--color-bg-sub); padding: 12px 18px; border-radius: 10px; width: 100%; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; font-size: 12px; border: 1px solid var(--color-border); margin-bottom: 10px; }
.bubble-wrap { display: flex; gap: 8px; flex-wrap: wrap; }

.b-pill { 
    padding: 6px 14px; border-radius: 15px; border: 1px solid var(--color-border); font-size: 11px; 
    cursor: pointer; background: var(--color-surface); color: var(--color-text-dim); 
    transition: all 0.1s; font-weight: 600; user-select: none;
}
.b-pill:hover { border-color: var(--color-text-light); transform: translateY(-1px); }
.b-pill.active { color: #fff !important; background: var(--color-all); border-color: var(--color-all); transform: scale(1.02); }

.combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
.combat-sec { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; min-height: 450px; }
.combat-sec h3 { font-size: 11px; margin-bottom: 12px; color: var(--color-text-light); border-bottom: 1px solid var(--color-border); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 1.5px; }

.loot-container { flex-grow: 1; border-top: 1px dashed var(--color-border); padding-top: 10px; margin-top: 10px; }
.loot-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--color-bg-sub); border-radius: 4px; transition: 0.1s; cursor: pointer; }
.loot-row:hover { background: var(--color-bg-sub); }

.entries { width: 100%; display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); overflow: hidden; }
.entry { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; font-size: 13px; border-bottom: 1px solid var(--color-bg-sub); transition: background 0.1s; }
.entry-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.entry-text-stack { display: flex; flex-direction: column; gap: 4px; }
.entry-title { font-weight: 700; color: var(--color-text); }
.entry-details { color: var(--color-text-dim); font-size: 12px; }
.entry-ts { color: var(--color-text-light); font-family: monospace; font-size: 11px; white-space: nowrap; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }

.hidden { display: none !important; }
.footer { font-size: 11px; color: var(--color-text-light); margin-top: 8px; width: 100%; text-align: right; }

/* XP Chart */
.xp-chart-wrap { width: 100%; margin-top: 10px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; }
.xp-chart-canvas-wrap { position: relative; height: 240px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header-row">
    <div class="search-wrap">
        <label class="upload-area" for="csv-file" id="upload-label">Click to upload CSV or wait for Google Sheet sync...</label>
        <input type="file" id="csv-file" accept=".csv" onchange="handleFileUpload(event)">
        <input type="text" id="search" placeholder="Search entries..." oninput="render()">
    </div>
    <div class="theme-toggle" onclick="toggleDarkMode()">
        <span id="theme-icon">🌙</span>
    </div>
  </div>

  <div class="filters" id="pills"></div>

  <div id="skill-controls" class="sub-controls skill-sec hidden">
    <div class="bubble-wrap">
        <div id="btn-xp" class="b-pill active" onclick="toggleSubFilter('skills', 'xp')">XP Milestones</div>
        <div id="btn-level" class="b-pill active" onclick="toggleSubFilter('skills', 'level')">Level Ups</div>
    </div>
    <div class="xp-chart-wrap">
      <div class="xp-chart-canvas-wrap">
        <canvas id="xp-chart"></canvas>
      </div>
    </div>
  </div>

  <div id="main-content" style="width: 100%;">
    <div id="combat-view" class="combat-grid hidden">
      <div class="combat-sec"><h3>Bosses</h3><div class="loot-container" id="boss-loot-list"></div></div>
      <div class="combat-sec"><h3>Slayer</h3><div class="loot-container" id="slayer-loot-list"></div></div>
    </div>
    <div class="entries" id="list"></div>
  </div>
  <div class="footer" id="footer">0 entries</div>
</div>

<script>
/**
 * CONFIGURATION: Paste your Google Sheet CSV export URL here.
 * To get this: File > Share > Publish to web > CSV.
 */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRwq4GRnaaKjl_VQjAiqP6vBIKvs_jhmF0DjZ-Z-B5veybXK0oEpoqSx8hyXjGNWH2UECVtII8VAzVr/pub?output=csv";

const BOSS_LIST = ["Araxxi", "Araxzor", "Arch-Glacor", "Beastmaster Durzag", "Black Stone Dragon", "Chaos Elemental", "Corporeal Beast", "Croesus", "Dagannoth Prime", "Dagannoth Rex", "Dagannoth Supreme", "General Graardor", "Gregorovic", "Helwyr", "Hermit", "Kalphite King", "Kalphite Queen", "Kerapac", "King Black Dragon", "K'ril Tsutsaroth", "Kree'arra", "Legio Primus", "Legio Secundus", "Legio Tertius", "Legio Quartus", "Legio Quintus", "Legio Sextus", "Magister", "Nex", "Nex: Angel of Death", "Osseous", "Pavo", "Oro", "Rath", "Raksha", "Rasial", "Solak", "Telos", "Twin Furies", "Vindicta", "Vorago", "Yakamaru", "Zamorak", "Zuk", "Rex Matriarchs", "Pthentraken", "Commander Zilyana"];
const SKILLS = ["Attack", "Strength", "Defence", "Ranged", "Prayer", "Magic", "Runecrafting", "Construction", "Constitution", "Agility", "Herblore", "Thieving", "Crafting", "Fletching", "Slayer", "Hunter", "Divination", "Mining", "Smithing", "Fishing", "Cooking", "Firemaking", "Woodcutting", "Farming", "Summoning", "Invention", "Archaeology", "Necromancy"];

let parsed = [];
let activeFilter = 'all';
let skillSubs = { xp: true, level: true, pet: true, total: true };

async function fetchGoogleSheetData() {
    if (!SHEET_URL || SHEET_URL.includes("PASTE_YOUR")) return;
    
    const label = document.getElementById('upload-label');
    label.textContent = "Connecting to Google Sheets...";
    try {
        const response = await fetch(SHEET_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const csvText = await response.text();
        label.textContent = "Data Source: Google Spreadsheet";
        
        // FIX: Changed from processCSV to processData
        processData(csvText); 
        
    } catch (err) {
        console.error("Failed to fetch Google Sheet data:", err);
        label.textContent = "Error: Could not load Google Sheet. Ensure the sheet is public.";
    }
}

function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => processData(event.target.result);
    reader.readAsText(file);
}

function processData(csvText) {
    const lines = csvText.split(/\r?\n/);
    parsed = lines.map(line => {
        const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (parts.length < 3) return null;
        const ts = parts[0].replace(/"/g, '').trim();
        const title = parts[1].replace(/"/g, '').trim();
        const details = parts[2].replace(/"/g, '').trim();
        
        let d = { ts, title, details, super: 'misc', sub: 'misc', skill: null };
        
        if (details.toLowerCase().includes('treasure trail')) {
            d.super = 'clues';
        } else if (/experience points|levelled|level 99/i.test(details)) {
            d.super = 'skills';
            SKILLS.forEach(s => { if (details.includes(s)) d.skill = s; });
            d.sub = details.includes('experience points') ? 'xp' : 'level';
        } else if (BOSS_LIST.some(b => details.includes(b))) {
            d.super = 'combat';
            d.sub = 'boss';
        }
        return d;
    }).filter(Boolean);
    render();
}

function setFilter(f) {
    activeFilter = f;
    render();
}

function render() {
    const list = document.getElementById('list');
    const filtered = parsed.filter(e => activeFilter === 'all' || e.super === activeFilter);
    
    document.getElementById('footer').textContent = `${filtered.length} entries`;
    list.innerHTML = filtered.map(e => `
        <div class="entry">
            <div class="entry-content">
                <span class="cat-dot" style="background:var(--color-${e.super})"></span>
                <div class="entry-text-stack">
                    <span class="entry-title">${e.title}</span>
                    <span class="entry-details">${e.details}</span>
                </div>
            </div>
            <span class="entry-ts">${e.ts}</span>
        </div>
    `).join('');
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    document.getElementById('theme-icon').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
}

// Initialize
const CATS = [
    { id: 'all', label: 'All' }, 
    { id: 'skills', label: 'Skills' }, 
    { id: 'combat', label: 'Combat' }, 
    { id: 'clues', label: 'Clues' }, 
    { id: 'misc', label: 'Misc' }
];
document.getElementById('pills').innerHTML = CATS.map(c => `
    <span class="pill ${activeFilter === c.id ? 'active' : ''}" onclick="setFilter('${c.id}')">
        <span class="dot" style="background:var(--color-${c.id})"></span>${c.label}
    </span>
`).join('');

fetchGoogleSheetData();
</script>
</body></html>
