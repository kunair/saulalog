<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alog - Live Dashboard</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <style>
        /* Exact styles from alog-v5 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --color-bg: #fdfdfd;
            --color-surface: #ffffff;
            --color-bg-sub: #f1f3f5;
            --color-border: #dee2e6;
            --color-text: #212529;
            --color-text-dim: #495057;
            --color-text-light: #adb5bd;
            --color-all: #7b1fa2;    
            --color-skill: #2e7d32;  
            --color-combat: #d32f2f; 
            --color-quest: #1565c0;  
            --color-clue: #ef6c00;   
            --color-misc: #455a64;   
        }

        body.dark-mode {
            --color-bg: #121212;
            --color-surface: #1e1e1e;
            --color-bg-sub: #2d2d2d;
            --color-border: #404040;
            --color-text: #f8f9fa;
            --color-text-dim: #ced4da;
            --color-text-light: #6c757d;
            --color-all: #ba68c8;    
            --color-skill: #81c784;  
            --color-combat: #e57373; 
            --color-quest: #64b5f6;  
            --color-clue: #ffd54f;   
            --color-misc: #90a4ae;   
        }

        body { background: var(--color-bg); color: var(--color-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; }
        .wrap { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 1100px; margin: 0 auto; }
        .header-row { width: 100%; max-width: 500px; display: flex; align-items: center; gap: 10px; }
        .search-wrap { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        input[type=text], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-size: 14px; outline: none; transition: 0.1s; }
        
        /* Updated status indicator to replace upload box */
        .data-status { border: 2px dashed var(--color-border); padding: 15px; width: 100%; text-align: center; border-radius: 10px; background: var(--color-surface); color: var(--color-text-dim); transition: 0.1s; font-size: 13px; font-weight: 600; }
        .data-status.syncing { border-color: var(--color-all); color: var(--color-all); background: var(--color-bg-sub); }
        .data-status.error { border-color: var(--color-combat); color: var(--color-combat); }

        .theme-toggle { cursor: pointer; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; transition: 0.1s; font-size: 18px; user-select: none; }
        .theme-toggle:hover { border-color: var(--color-all); background: var(--color-bg-sub); }

        .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
        .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 20px; border: 1px solid var(--color-border); font-size: 13px; cursor: pointer; background: var(--color-surface); transition: all 0.1s; font-weight: 600; user-select: none; }
        .pill.active { border-color: currentColor; background: var(--color-bg-sub); box-shadow: 0 2px 8px rgba(0,0,0,0.1), inset 0 0 0 1px currentColor; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        .sub-controls { background: var(--color-bg-sub); padding: 12px 18px; border-radius: 10px; width: 100%; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; font-size: 12px; border: 1px solid var(--color-border); margin-bottom: 10px; }
        .bubble-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
        .b-pill { padding: 6px 14px; border-radius: 15px; border: 1px solid var(--color-border); font-size: 11px; cursor: pointer; background: var(--color-surface); color: var(--color-text-dim); transition: all 0.1s; font-weight: 600; user-select: none; }
        .b-pill.active { color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.2); transform: scale(1.02); }
        
        .skill-sec .b-pill.active { background: var(--color-skill); border-color: var(--color-skill); }
        .combat-sec .b-pill.active { background: var(--color-combat); border-color: var(--color-combat); }
        .clue-sec .b-pill.active { background: var(--color-clue); border-color: var(--color-clue); }

        .combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .combat-sec { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; min-height: 450px; }
        .combat-sec h3 { font-size: 11px; margin-bottom: 12px; color: var(--color-text-light); border-bottom: 1px solid var(--color-border); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 1.5px; }

        .loot-container { flex-grow: 1; border-top: 1px dashed var(--color-border); padding-top: 10px; margin-top: 10px; }
        .loot-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--color-bg-sub); border-radius: 4px; }
        .loot-name { flex: 1; padding-right: 15px; }
        .loot-count { font-weight: 800; margin-right: 10px; color: var(--color-combat); }
        .loot-ts { color: var(--color-text-light); font-family: monospace; font-size: 11px; white-space: nowrap; }

        .entries { width: 100%; display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); overflow: hidden; }
        .entry { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; font-size: 13px; border-bottom: 1px solid var(--color-bg-sub); }
        .entry-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
        .entry-title { font-weight: 700; }
        .entry-details { color: var(--color-text-dim); font-size: 12px; margin-top: 2px; }
        .cat-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
        
        .xp-chart-wrap { width: 100%; margin-top: 10px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px 16px; }
        .xp-chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .xp-chart-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--color-text-dim); }
        
        .hidden { display: none !important; }
        .footer { font-size: 11px; color: var(--color-text-light); text-align: right; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="wrap">
    <div class="header-row">
        <div class="search-wrap">
            <div id="data-status" class="data-status syncing">Connecting to Google Sheets...</div>
            <input type="text" id="search" placeholder="Search by title, monster, or drop..." oninput="render()">
        </div>
        <div class="theme-toggle" onclick="toggleDarkMode()">
            <span id="theme-icon">🌙</span>
        </div>
    </div>

    <div class="filters" id="pills">
        <span class="pill active" id="pill-all" onclick="setFilter('all')" style="color:var(--color-all)"><span class="dot" style="background:var(--color-all)"></span>All</span>
        <span class="pill" id="pill-skills" onclick="setFilter('skills')" style="color:var(--color-skill)"><span class="dot" style="background:var(--color-skill)"></span>Skills</span>
        <span class="pill" id="pill-combat" onclick="setFilter('combat')" style="color:var(--color-combat)"><span class="dot" style="background:var(--color-combat)"></span>Combat</span>
        <span class="pill" id="pill-clues" onclick="setFilter('clues')" style="color:var(--color-clue)"><span class="dot" style="background:var(--color-clue)"></span>Clues</span>
        <span class="pill" id="pill-quests" onclick="setFilter('quests')" style="color:var(--color-quest)"><span class="dot" style="background:var(--color-quest)"></span>Quests</span>
        <span class="pill" id="pill-misc" onclick="setFilter('misc')" style="color:var(--color-misc)"><span class="dot" style="background:var(--color-misc)"></span>Misc</span>
    </div>

    <div id="skill-controls" class="sub-controls skill-sec hidden">
        <div id="skill-picker" class="skill-picker" style="width:100%">
            <div class="bubble-wrap" id="skill-flat-view"></div>
        </div>
        <div class="bubble-wrap" style="margin-top:6px;">
            <div id="btn-xp" class="b-pill active" onclick="toggleSubFilter('skills', 'xp')">XP Milestones</div>
            <div id="btn-level" class="b-pill active" onclick="toggleSubFilter('skills', 'level')">Level Ups</div>
            <div id="btn-pet" class="b-pill active" onclick="toggleSubFilter('skills', 'pet')">Skilling Pets</div>
            <div id="btn-total" class="b-pill active" onclick="toggleSubFilter('skills', 'total')">Total Level</div>
        </div>
        <div class="xp-chart-wrap">
            <div class="xp-chart-header">
                <span class="xp-chart-title">XP Progress</span>
                <button class="b-pill" onclick="resetXpChart()">Reset Zoom</button>
            </div>
            <canvas id="xp-chart" height="120"></canvas>
        </div>
    </div>

    <div id="clue-controls" class="sub-controls clue-sec hidden">
        <div class="bubble-wrap">
            <div id="btn-easy" class="b-pill active" onclick="toggleSubFilter('clues', 'easy')">Easy</div>
            <div id="btn-medium" class="b-pill active" onclick="toggleSubFilter('clues', 'medium')">Medium</div>
            <div id="btn-hard" class="b-pill active" onclick="toggleSubFilter('clues', 'hard')">Hard</div>
            <div id="btn-elite" class="b-pill active" onclick="toggleSubFilter('clues', 'elite')">Elite</div>
            <div id="btn-master" class="b-pill active" onclick="toggleSubFilter('clues', 'master')">Master</div>
        </div>
    </div>

    <div id="main-content" style="width: 100%;">
        <div id="combat-view" class="combat-grid hidden">
            <div class="combat-sec">
                <h3>Bosses</h3>
                <div class="bubble-wrap" id="boss-bubbles"></div>
                <div style="margin-top:10px;"><select id="boss-more" onchange="selectMonster('boss', this.value)"></select></div>
                <div class="loot-container" id="boss-loot-list"></div>
            </div>
            <div class="combat-sec">
                <h3>Slayer</h3>
                <div class="bubble-wrap" id="slayer-bubbles"></div>
                <div style="margin-top:10px;"><select id="slayer-more" onchange="selectMonster('slayer', this.value)"></select></div>
                <div class="loot-container" id="slayer-loot-list"></div>
            </div>
        </div>

        <div id="feed-view" class="entries"></div>
    </div>

    <div class="footer" id="footer">0 entries</div>
</div>

<script>
/* Configuration from alog-v6 */
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Bf83Y5OIn9Bq-U5n5Hq62RNDXIn_jO3XmS0Ie5YvIas/export?format=csv';

/* Global State */
let allData = [];
let currentFilter = 'all';
let selSkill = 'all';
let selBoss = '';
let selSlayer = '';
let subFilters = { skills: ['xp', 'level', 'pet', 'total'], clues: ['easy', 'medium', 'hard', 'elite', 'master'] };
let xpChart = null;

/* Skills Mapping from v5 */
const SKILLS = [
    "Attack","Strength","Defence","Ranged","Prayer","Magic","Runecrafting","Construction","Constitution","Agility","Herblore","Thieving","Crafting","Fletching","Slayer","Hunter","Divination","Mining","Smithing","Fishing","Cooking","Firemaking","Woodcutting","Farming","Summoning","Invention","Archaeology","Necromancy"
];

/* Initialize on Load */
window.onload = () => {
    fetchData();
    if (localStorage.getItem('dark-mode') === 'true') toggleDarkMode();
};

async function fetchData() {
    const status = document.getElementById('data-status');
    try {
        const response = await fetch(SHEET_URL);
        const csvText = await response.text();
        parseCSV(csvText);
        status.textContent = 'Live Data Connected';
        status.className = 'data-status';
    } catch (err) {
        status.textContent = 'Connection Error - Check Sheet Permissions';
        status.className = 'data-status error';
    }
}

function parseCSV(text) {
    const lines = text.split('\n').filter(l => l.trim());
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
    
    allData = lines.slice(1).map(line => {
        const cols = line.split(',');
        let obj = {};
        headers.forEach((h, i) => obj[h] = cols[i]?.trim());
        return obj;
    }).filter(d => d.ts && d.title);

    processData();
}

function processData() {
    allData.sort((a, b) => new Date(b.ts) - new Date(a.ts));
    
    // Auto-select first monsters
    const bosses = [...new Set(allData.filter(e => e.cat === 'combat' && e.monster_type === 'boss').map(e => e.monster))];
    const slayer = [...new Set(allData.filter(e => e.cat === 'combat' && e.monster_type === 'slayer').map(e => e.monster))];
    if (bosses.length) selBoss = bosses[0];
    if (slayer.length) selSlayer = slayer[0];

    buildSkillPicker();
    render();
}

/* UI Logic (Direct Ports from v5) */
function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    document.getElementById(`pill-${f}`).classList.add('active');
    
    document.getElementById('skill-controls').classList.toggle('hidden', f !== 'skills');
    document.getElementById('clue-controls').classList.toggle('hidden', f !== 'clues');
    document.getElementById('combat-view').classList.toggle('hidden', f !== 'combat');
    document.getElementById('feed-view').classList.toggle('hidden', f === 'combat');
    
    render();
}

function toggleSubFilter(cat, type) {
    const idx = subFilters[cat].indexOf(type);
    if (idx > -1) subFilters[cat].splice(idx, 1);
    else subFilters[cat].push(type);
    
    document.getElementById(`btn-${type}`).classList.toggle('active');
    render();
}

function selectMonster(type, name) {
    if (type === 'boss') selBoss = name;
    else selSlayer = name;
    renderCombatSide(type, allData.filter(e => e.cat === 'combat' && e.monster_type === type));
}

function render() {
    const search = document.getElementById('search').value.toLowerCase();
    
    let filtered = allData.filter(e => {
        const textMatch = (e.title + e.details + e.monster + e.item).toLowerCase().includes(search);
        if (!textMatch) return false;
        
        if (currentFilter === 'all') return true;
        if (currentFilter === 'skills') {
            if (e.cat !== 'skills') return false;
            if (selSkill !== 'all' && e.skill !== selSkill) return false;
            return subFilters.skills.includes(e.type);
        }
        if (currentFilter === 'clues') return e.cat === 'clues' && subFilters.clues.includes(e.type);
        if (currentFilter === 'combat') return e.cat === 'combat';
        return e.cat === currentFilter;
    });

    if (currentFilter === 'combat') {
        renderCombatSide('boss', allData.filter(e => e.cat === 'combat' && e.monster_type === 'boss'));
        renderCombatSide('slayer', allData.filter(e => e.cat === 'combat' && e.monster_type === 'slayer'));
    } else {
        renderFeed(filtered);
    }
    
    if (currentFilter === 'skills') renderXpChart(filtered);
    
    document.getElementById('footer').textContent = `${filtered.length} entries`;
}

function renderFeed(items) {
    const container = document.getElementById('feed-view');
    const colors = { skills: 'var(--color-skill)', combat: 'var(--color-combat)', quests: 'var(--color-quest)', clues: 'var(--color-clue)', misc: 'var(--color-misc)' };
    
    container.innerHTML = items.slice(0, 100).map(e => `
        <div class="entry">
            <div class="entry-content">
                <div class="cat-dot" style="background:${colors[e.cat] || 'gray'}"></div>
                <div>
                    <div class="entry-title">${e.title}</div>
                    <div class="entry-details">${e.details}</div>
                </div>
            </div>
            <div class="entry-ts">${e.ts}</div>
        </div>
    `).join('');
}

function renderCombatSide(type, entries) {
    const names = [...new Set(entries.map(e => e.monster))];
    const top5 = names.slice(0, 5);
    const currentMonster = (type === 'boss') ? selBoss : selSlayer;

    document.getElementById(`${type}-bubbles`).innerHTML = top5.map(n => `
        <div class="b-pill ${currentMonster === n ? 'active' : ''}" onclick="selectMonster('${type}', '${n.replace(/'/g, "\\'")}')">${n}</div>
    `).join('');

    const others = names.slice(5);
    document.getElementById(`${type}-more`).innerHTML = `<option value="">More...</option>` + 
        others.map(n => `<option value="${n}" ${currentMonster === n ? 'selected' : ''}>${n}</option>`).join('');

    const lootListEl = document.getElementById(`${type}-loot-list`);
    const history = entries.filter(e => e.monster === currentMonster);
    
    lootListEl.innerHTML = history.slice(0, 20).map(g => `
        <div class="loot-row">
            <span class="loot-name">${g.item || 'Kill recorded'}</span>
            <span class="loot-ts">${g.ts}</span>
        </div>`).join('');
}

function buildSkillPicker() {
    const container = document.getElementById('skill-flat-view');
    container.innerHTML = `<div class="b-pill ${selSkill === 'all' ? 'active' : ''}" onclick="setSkillFilter('all')">All</div>` +
        SKILLS.map(s => `<div class="b-pill ${selSkill === s ? 'active' : ''}" onclick="setSkillFilter('${s}')">${s}</div>`).join('');
}

function setSkillFilter(s) {
    selSkill = s;
    buildSkillPicker();
    render();
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('dark-mode', isDark);
    if (xpChart) {
        xpChart.options.scales.x.grid.color = isDark ? '#404040' : '#dee2e6';
        xpChart.options.scales.y.grid.color = isDark ? '#404040' : '#dee2e6';
        xpChart.update();
    }
}

/* XP Chart Logic from v5 */
function renderXpChart(filtered) {
    const ctx = document.getElementById('xp-chart').getContext('2d');
    const chartData = filtered
        .filter(e => e.type === 'xp' || e.type === 'total')
        .map(e => ({ x: new Date(e.ts), y: parseInt(e.xp_gain || 0) }))
        .sort((a, b) => a.x - b.x);

    if (xpChart) xpChart.destroy();
    
    xpChart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: 'XP Gain',
                data: chartData,
                borderColor: '#2e7d32',
                backgroundColor: 'rgba(46, 125, 50, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { display: false },
                zoom: { zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }, pan: { enabled: true, mode: 'x' } }
            },
            scales: {
                x: { type: 'time', time: { unit: 'month' }, grid: { color: 'transparent' } },
                y: { beginAtZero: true }
            }
        }
    });
}

function resetXpChart() {
    if (xpChart) xpChart.resetZoom();
}
</script>

</body>
</html>
