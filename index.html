<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adventurer's Log Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --color-bg: #fdfdfd; --color-surface: #ffffff; --color-bg-sub: #f1f3f5;
            --color-border: #dee2e6; --color-text: #212529; --color-text-dim: #495057;
            --color-text-light: #adb5bd; --color-all: #7b1fa2; --color-skill: #2e7d32;
            --color-combat: #d32f2f; --color-quest: #1565c0; --color-clue: #ef6c00; --color-misc: #455a64;
        }
        body.dark-mode {
            --color-bg: #121212; --color-surface: #1e1e1e; --color-bg-sub: #2d2d2d;
            --color-border: #404040; --color-text: #f8f9fa; --color-text-dim: #ced4da;
            --color-text-light: #6c757d; --color-all: #ba68c8; --color-skill: #81c784;
            --color-combat: #e57373; --color-quest: #64b5f6; --color-clue: #ffd54f; --color-misc: #90a4ae;
        }
        body { background: var(--color-bg); color: var(--color-text); font-family: -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
        .wrap { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 1100px; margin: 0 auto; }
        .header-row { width: 100%; max-width: 500px; display: flex; align-items: center; gap: 10px; }
        .search-wrap { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        input[type=text], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); }
        .theme-toggle { cursor: pointer; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; }
        
        .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
        .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 20px; border: 1px solid var(--color-border); font-size: 13px; cursor: pointer; background: var(--color-surface); font-weight: 600; }
        .pill.active { border-color: currentColor; background: var(--color-bg-sub); }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        .sub-controls { background: var(--color-bg-sub); padding: 12px 18px; border-radius: 10px; width: 100%; border: 1px solid var(--color-border); margin-bottom: 10px; }
        .bubble-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
        .b-pill { padding: 6px 14px; border-radius: 15px; border: 1px solid var(--color-border); font-size: 11px; cursor: pointer; background: var(--color-surface); color: var(--color-text-dim); font-weight: 600; transition: 0.1s; }
        .b-pill.active { color: #fff !important; background: var(--color-text-dim); }
        
        /* Skills chart adjustments */
        .xp-chart-wrap { width: 100%; margin-top: 10px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; }
        .xp-chart-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .xp-chart-title { font-size: 11px; font-weight: 700; text-transform: uppercase; flex: 1; }
        .xp-pet-note { font-size: 10px; color: #f0c040; font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .xp-chart-canvas-wrap { height: 260px; position: relative; }

        .combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .combat-sec { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 15px; min-height: 400px; }
        .combat-sec h3 { font-size: 11px; margin-bottom: 10px; color: var(--color-text-light); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--color-border); padding-bottom: 4px; }
        .loot-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px; border-bottom: 1px solid var(--color-bg-sub); }
        .loot-count { font-weight: 800; color: var(--color-combat); margin-right: 6px; }

        .entries { width: 100%; display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); overflow: hidden; }
        .entry { display: flex; justify-content: space-between; padding: 12px 18px; font-size: 13px; border-bottom: 1px solid var(--color-bg-sub); }
        .cat-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
        .entry-content { display: flex; gap: 12px; }
        .entry-title { font-weight: 700; }
        .entry-details { color: var(--color-text-dim); font-size: 12px; }
        .entry-ts { color: var(--color-text-light); font-size: 11px; font-family: monospace; }
        .hidden { display: none !important; }
        .footer { width: 100%; text-align: right; font-size: 11px; color: var(--color-text-light); margin-top: 10px; }

        /* Skill Picker */
        .sk-btn { padding: 4px 10px; border-radius: 10px; border: 1px solid var(--color-border); font-size: 11px; cursor: pointer; background: var(--color-surface); }
        .sk-btn.active { background: var(--color-skill); color: #fff; }
    </style>
</head>
<body>

<div class="wrap">
    <div class="header-row">
        <div class="search-wrap">
            <input type="text" id="search" placeholder="Search entries..." oninput="render()">
        </div>
        <div class="theme-toggle" onclick="toggleDarkMode()">🌙</div>
    </div>

    <div class="filters" id="pills">
        <span class="pill active" onclick="setFilter('all')" style="color:var(--color-all)"><span class="dot" style="background:var(--color-all)"></span>All</span>
        <span class="pill" onclick="setFilter('skills')" style="color:var(--color-skill)"><span class="dot" style="background:var(--color-skill)"></span>Skills</span>
        <span class="pill" onclick="setFilter('combat')" style="color:var(--color-combat)"><span class="dot" style="background:var(--color-combat)"></span>Combat</span>
        <span class="pill" onclick="setFilter('clues')" style="color:var(--color-clue)"><span class="dot" style="background:var(--color-clue)"></span>Clues</span>
        <span class="pill" onclick="setFilter('quests')" style="color:var(--color-quest)"><span class="dot" style="background:var(--color-quest)"></span>Quests</span>
        <span class="pill" onclick="setFilter('misc')" style="color:var(--color-misc)"><span class="dot" style="background:var(--color-misc)"></span>Misc</span>
    </div>

    <div id="skill-controls" class="sub-controls hidden">
        <div class="bubble-wrap" id="skill-picker" style="margin-bottom:10px;"></div>
        <div class="xp-chart-wrap">
            <div class="xp-chart-header">
                <span class="xp-chart-title" id="xp-chart-title">XP Progress</span>
                <div class="xp-pet-note" id="xp-pet-note" style="display:none;">⭐ = Skilling pet obtained</div>
                <button class="b-pill" style="font-size:10px;" onclick="resetXpChart()">Reset Zoom</button>
            </div>
            <div class="xp-chart-canvas-wrap"><canvas id="xp-chart"></canvas></div>
        </div>
    </div>

    <div id="main-content" style="width: 100%;">
        <div id="combat-view" class="combat-grid hidden">
            <div class="combat-sec"><h3>Bosses</h3><div id="boss-list"></div></div>
            <div class="combat-sec"><h3>Slayer</h3><div id="slayer-list"></div></div>
        </div>
        <div class="entries" id="list"></div>
        <div class="footer" id="footer">Loading data from Google Sheets...</div>
    </div>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1DaIyQQA5XrpFHUN6r6Ntl_JKQ95vHPpQTLrNNm6m6Ag/export?format=csv';
const BOSS_LIST = ["Araxxi", "Araxzor", "Arch-Glacor", "Beastmaster Durzag", "Black Stone Dragon", "Chaos Elemental", "Corporeal Beast", "Croesus", "Dagannoth Prime", "Dagannoth Rex", "Dagannoth Supreme", "General Graardor", "Gregorovic", "Helwyr", "Hermit", "Kalphite King", "Kalphite Queen", "Kerapac", "King Black Dragon", "K'ril Tsutsaroth", "Kree'arra", "Legio Primus", "Legio Secundus", "Legio Tertius", "Legio Quartus", "Legio Quintus", "Legio Sextus", "Magister", "Nex", "Nex: Angel of Death", "Osseous", "Pavo", "Oro", "Rath", "Rathis", "Raksha", "Rasial", "Solak", "Telos", "Twin Furies", "Vindicta", "Vorago", "Yakamaru", "Zamorak", "Zuk", "Rex Matriarchs", "Pthentraken", "Orikalka", "Commander Zilyana", "Astellarn", "Verak Lith"];
const SKILLS = ["Overall", "Attack", "Defence", "Strength", "Constitution", "Ranged", "Prayer", "Magic", "Cooking", "Woodcutting", "Fletching", "Fishing", "Firemaking", "Crafting", "Smithing", "Mining", "Herblore", "Agility", "Thieving", "Slayer", "Farming", "Runecrafting", "Hunter", "Construction", "Summoning", "Dungeoneering", "Divination", "Invention", "Archaeology", "Necromancy"];

let rawData = [];
let activeFilter = 'all';
let skillFilter = 'Overall';
let xpChart = null;

async function fetchData() {
    try {
        const response = await fetch(SHEET_URL);
        const csv = await response.text();
        parseCSV(csv);
        render();
    } catch (e) {
        document.getElementById('footer').textContent = "Error loading data.";
    }
}

function parseCSV(csv) {
    const lines = csv.split('\n');
    rawData = lines.map(line => {
        const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (parts.length < 3) return null;
        const ts = parts[0].replace(/"/g, '').trim();
        const title = parts[1].replace(/"/g, '').trim();
        const details = parts[2].replace(/"/g, '').trim();
        
        let d = { ts, title, details, super: 'misc', sub: 'misc', skill: null, monster: null, date: new Date(ts) };

        const lowDet = details.toLowerCase();
        const lowTit = title.toLowerCase();

        // Original Filtering Conditions
        if (lowDet.includes('treasure trail')) {
            d.super = 'clues';
            ['easy', 'medium', 'hard', 'elite', 'master'].forEach(diff => { if (lowDet.includes(diff)) d.sub = diff; });
        } 
        else if (/experience points in the|I levelled|level 99|While skilling|achieved at least level/i.test(details)) {
            d.super = 'skills';
            SKILLS.forEach(s => { if (details.includes(s)) d.skill = s; });
            d.sub = lowDet.includes('experience points') ? 'xp' : lowDet.includes('while skilling') ? 'pet' : 'level';
            if (lowDet.includes('experience points')) {
                const xpMatch = details.match(/([\d,]+) experience points/);
                if (xpMatch) d.xp = parseInt(xpMatch[1].replace(/,/g, ''));
            }
        }
        else if ((lowDet.includes('quest completed') || lowDet.includes('completed the quest') || lowTit.includes('quest complete'))) {
            d.super = 'quests';
        }
        else if (/killed|dropped|looted|found|surviving|defeating/i.test(details)) {
            d.super = 'combat';
            const mMatch = details.match(/(?:killing|defeating|surviving|killing a|defeated) (?:the |a )?([\w\s':]+?)(?:, it dropped|: Rex Matriarchs|\.|$)/i);
            if (mMatch) {
                d.monster = mMatch[1].trim();
                d.sub = BOSS_LIST.some(b => d.monster.toLowerCase().includes(b.toLowerCase())) ? 'boss' : 'slayer';
            }
        }
        return d;
    }).filter(d => d && !isNaN(d.date));
}

function setFilter(f) {
    activeFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    event.currentTarget.classList.add('active');
    render();
}

function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const list = document.getElementById('list');
    const combatView = document.getElementById('combat-view');
    const skillCtrl = document.getElementById('skill-controls');
    
    combatView.classList.add('hidden');
    skillCtrl.classList.add('hidden');
    list.classList.remove('hidden');

    let filtered = rawData.filter(d => {
        if (activeFilter !== 'all' && d.super !== activeFilter) return false;
        if (search && !d.title.toLowerCase().includes(search) && !d.details.toLowerCase().includes(search)) return false;
        return true;
    });

    if (activeFilter === 'combat') {
        renderCombat(filtered);
    } else if (activeFilter === 'skills') {
        skillCtrl.classList.remove('hidden');
        list.classList.add('hidden');
        renderSkills();
    } else {
        list.innerHTML = filtered.map(d => `
            <div class="entry">
                <div class="entry-content">
                    <span class="cat-dot" style="background:var(--color-${d.super})"></span>
                    <div><div class="entry-title">${d.title}</div><div class="entry-details">${d.details}</div></div>
                </div>
                <span class="entry-ts">${d.ts}</span>
            </div>
        `).join('');
    }
    document.getElementById('footer').textContent = `${filtered.length} entries found.`;
}

function renderCombat(entries) {
    document.getElementById('combat-view').classList.remove('hidden');
    document.getElementById('list').classList.add('hidden');
    
    const bosses = entries.filter(e => e.sub === 'boss');
    const slayer = entries.filter(e => e.sub === 'slayer');
    
    const fmt = (list) => list.slice(0,20).map(e => `<div class="loot-row"><span><span class="loot-count">1x</span>${e.monster || 'Unknown'}</span><span style="font-family:monospace">${e.ts}</span></div>`).join('');
    
    document.getElementById('boss-list').innerHTML = fmt(bosses);
    document.getElementById('slayer-list').innerHTML = fmt(slayer);
}

function renderSkills() {
    const picker = document.getElementById('skill-picker');
    picker.innerHTML = SKILLS.map(s => `<button class="sk-btn ${skillFilter===s?'active':''}" onclick="skillFilter='${s}';renderSkills()">${s}</button>`).join('');
    updateXpChart();
}

function updateXpChart() {
    const canvas = document.getElementById('xp-chart');
    const entries = rawData.filter(d => d.skill === skillFilter && d.xp).sort((a,b) => a.date - b.date);
    const pets = rawData.filter(d => d.skill === skillFilter && d.sub === 'pet');
    
    document.getElementById('xp-pet-note').style.display = pets.length > 0 ? 'flex' : 'none';

    const datasets = [{
        label: 'XP',
        data: entries.map(e => ({ x: e.date, y: e.xp })),
        borderColor: '#2e7d32',
        tension: 0.3,
        pointRadius: 2
    }];

    if (pets.length > 0) {
        datasets.push({
            label: 'Pet Obtained',
            data: pets.map(p => {
                const nearestXP = entries.reduce((prev, curr) => Math.abs(curr.date - p.date) < Math.abs(prev.date - p.date) ? curr : prev, entries[0]);
                return { x: p.date, y: nearestXP ? nearestXP.xp : 0 };
            }),
            type: 'scatter',
            pointStyle: 'star',
            pointRadius: 12,
            backgroundColor: '#f0c040',
            borderColor: '#c8930a'
        });
    }

    if (xpChart) xpChart.destroy();
    xpChart = new Chart(canvas, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { display: false },
                zoom: { zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }, pan: { enabled: true, mode: 'x' } }
            },
            scales: {
                x: { type: 'time', time: { unit: 'month' } },
                y: { ticks: { callback: v => v.toLocaleString() } }
            }
        }
    });
}

function resetXpChart() { if (xpChart) xpChart.resetZoom(); }
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

fetchData();
</script>

</body>
</html>
